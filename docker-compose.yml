version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - postgres
    networks:
      - pharmacy-network

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - pharmacy-network

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=pharmacy_invoice
      - POSTGRES_USER=pharmacy_user
      - POSTGRES_PASSWORD=pharmacy_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pharmacy-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - pharmacy-network

volumes:
  postgres_data:

networks:
  pharmacy-network:
    driver: bridge
