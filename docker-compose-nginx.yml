version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: pharmacy-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - pharmacy-network
    restart: unless-stopped

  backend:
    image: pharmacy-backend
    container_name: pharmacy-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:80}
    networks:
      - pharmacy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: pharmacy-frontend
    container_name: pharmacy-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - pharmacy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  pharmacy-network:
    driver: bridge
